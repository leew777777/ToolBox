<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Code 產生器</title>
<script src="lib/jquery-4.0.0.min.js"></script>
<script src="lib/jquery.qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; background: #eef1f6; color: #333; }
  h1 { margin: 0; padding: 16px 24px; font-size: 20px; color: #fff; background: linear-gradient(90deg, #3b6fd4, #5b9bf0); }
  .wrap { display: flex; gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; }
  .card { flex: 1; min-width: 0; background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: #3b6fd4; }
  textarea { width: 100%; height: 420px; padding: 10px; font-size: 15px; border: 1px solid #c5cde0; border-radius: 6px; resize: vertical; outline: none; }
  input[type=text] { width: 100%; padding: 8px 10px; font: inherit; font-size: 15px; border: 1px solid #c5cde0; border-radius: 6px; outline: none; }
  .clr { position: relative; }
  .clr input { padding-right: 32px; }
  #btnClr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; padding: 0; font-size: 18px; line-height: 20px; color: #888; background: #e6eaf3; border: 0; border-radius: 50%; cursor: pointer; }
  #btnClr:hover { color: #fff; background: #3b6fd4; }
  input[type=text]:focus, textarea:focus { border-color: #3b6fd4; box-shadow: 0 0 0 3px rgba(59,111,212,.15); }
  textarea:focus { border-color: #3b6fd4; box-shadow: 0 0 0 3px rgba(59,111,212,.15); }
  .right { text-align: center; background: #dbeafe; }
  #btnDl { margin-top: 12px; padding: 8px 22px; font: inherit; font-size: 15px; color: #fff; background: #3b6fd4; border: 0; border-radius: 6px; cursor: pointer; }
  #btnDl:hover { background: #2f5cb8; }
  #btnDl:disabled { background: #a9b6d4; cursor: default; }
  #qrcode { display: inline-block; background: #fff; border: 1px solid #d5dbe8; border-radius: 6px; min-height: 40px; }
  #qrcode canvas { max-width: 100%; height: auto; display: block; }
  #cnt { font-weight: normal; color: #888; }
  #info { margin-top: 10px; font-size: 13px; color: #888; }
  @media (max-width: 700px) { .wrap { flex-direction: column; } textarea { height: 180px; } }
</style>
</head>
<body>
<h1>QR Code 產生器</h1>
<div class="wrap">
  <div class="card">
    <h2>標題（選填，未輸入則 QR Code 為正方形）</h2>
    <div class="clr"><input id="title" type="text" placeholder="有輸入則顯示在 QR Code 上方" value="這裡可放標題文字"><button id="btnClr" type="button" title="清除標題">&times;</button></div>
    <h2 style="margin-top:14px">輸入網址或文字 <span id="cnt"></span></h2>
    <textarea id="txt" placeholder="在此輸入網址或文字（可多行）…" autofocus>https://www.google.com/</textarea>
  </div>
  <div class="card right">
    <h2>QR Code</h2>
    <div id="qrcode"></div>
    <div id="info"></div>
    <button id="btnDl" type="button">下載 PNG</button>
  </div>
</div>
<script>
$(function () {
    var k = 2; // 內部以 k 倍解析度繪圖（較清晰），顯示時再以 CSS 縮回
    var size = 320 * k, margin = 24 * k; // margin：圖片四周白邊（顯示 px × k）
    function show() {
        var t = $('#txt').val();
        var $q = $('#qrcode').empty();
        $('#btnClr').toggle($('#title').val() !== '');
        $('#btnDl').prop('disabled', true);
        $('#cnt').text('（字數：' + t.length + '）');
        if (!t) { $('#info').text('請輸入內容'); return; }
        try {
            $q.qrcode({ width: size, height: size, correctLevel: 0, text: unescape(encodeURIComponent(t)) }); // 函式庫只處理單位元組，先轉成 UTF-8 才能支援中文
            // 讓圖片本身帶白邊：畫到較大的白底 canvas 後取代原圖
            var src = $q.find('canvas')[0], cv = document.createElement('canvas');
            var w = size + margin * 2, qrY = margin, title = $('#title').val().trim(), fs = 22 * k, face = '"Microsoft JhengHei", sans-serif';
            if (title) {
                // 標題過寬時縮小字級（最小 10px），仍過寬則以「…」截斷，避免切到字
                var mc = document.createElement('canvas').getContext('2d');
                mc.font = 'bold ' + fs + 'px ' + face;
                while (mc.measureText(title).width > w - 16 * k && fs > 10 * k) mc.font = 'bold ' + (--fs) + 'px ' + face;
                while (mc.measureText(title).width > w - 16 * k && title.length > 1) title = title.slice(0, -2) + '…';
                qrY = margin + Math.ceil(fs * 1.3) + 6 * k; // 上白邊 + 字高 + 與 QR 的間距
            }
            cv.width = w;
            cv.height = qrY + size + margin; // 無標題時 qrY = margin，圖為正方形
            var cx = cv.getContext('2d');
            cx.fillStyle = '#fff';
            cx.fillRect(0, 0, cv.width, cv.height);
            if (title) {
                cx.fillStyle = '#000';
                cx.font = 'bold ' + fs + 'px ' + face;
                cx.textAlign = 'center';
                cx.textBaseline = 'middle';
                cx.fillText(title, w / 2, margin + Math.ceil(fs * 1.3) / 2 - 10 * k); // 再往上移 10px，與 QR 之間留較多空隙
            }
            cx.drawImage(src, margin, qrY);
            cv.style.width = cv.width / k + 'px'; // 顯示大小縮回 1/k，下載的 PNG 仍為高解析度
            $q.empty().append(cv);
            $('#info').text('');
            $('#btnDl').prop('disabled', false);
        } catch (e) {
            $('#info').text('內容過長，無法產生 QR Code');
        }
    }
    $('#btnDl').on('click', function () {
        var cv = $('#qrcode canvas')[0];
        if (!cv) return;
        var name = ($('#title').val().trim() || 'qrcode').replace(/[\\\/:*?"<>|]/g, '_');
        var a = document.createElement('a');
        a.href = cv.toDataURL('image/png');
        var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
        var stamp = d.getFullYear() + '_' + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '_'; // yyyy_MMdd_HHmm_
        a.download = stamp + name + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
    $('#btnClr').on('click', function () { $('#title').val('').focus(); show(); });
    $('#txt, #title').on('input keyup', show);
    show();
});
</script>
</body>
</html>
